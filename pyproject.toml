[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linguistic-core"
version = "0.3.2"
description = "SUMO/PropBank/FrameNet-derived predicate vocabulary pack, compiler, and donor-mapping verification tooling"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
review = [
  "llm-client @ git+https://github.com/Inside-Success/llm_client.git@e4f3a0be3f4b9636f951c9f40e881a34442e33d1",
]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/linguistic_core"]

[tool.hatch.build.targets.wheel.force-include]
"ontology_packs/linguistic_core" = "linguistic_core/ontology_packs/linguistic_core"
"linguistic_trace_adjuncts/linguistic_core" = "linguistic_core/linguistic_trace_adjuncts/linguistic_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
